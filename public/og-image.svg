<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="80" r="200" fill="#60a5fa" opacity="0.05"/>
  <circle cx="100" cy="550" r="150" fill="#60a5fa" opacity="0.05"/>
  <rect x="0" y="580" width="1200" height="50" fill="#60a5fa" opacity="0.1"/>

  <!-- Accent line top -->
  <rect x="80" y="160" width="80" height="4" rx="2" fill="url(#accent)"/>

  <!-- Company name -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">TRANSPORTES EDGARDO</text>

  <!-- Tagline -->
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Transporte de Cargas en CABA y Gran Buenos Aires</text>

  <!-- Services line -->
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#60a5fa" letter-spacing="3">CHASIS · BALANCÍN · SEMIRREMOLQUE · AUTOELEVADOR</text>

  <!-- Divider -->
  <rect x="80" y="390" width="400" height="1" fill="#334155"/>

  <!-- Features -->
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">✓ Monitoreo GPS 24 hs</text>
  <text x="80" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">✓ Cobertura CABA y Gran Buenos Aires</text>
  <text x="80" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">✓ Presupuesto sin cargo</text>

  <!-- Phone -->
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">(11) 7136-6651</text>

  <!-- Website -->
  <text x="1120" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b" text-anchor="end">transporteedgardo.com.ar</text>

  <!-- Truck icon (simplified) -->
  <g transform="translate(850, 150)" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
    <rect x="0" y="20" width="200" height="100" rx="8" stroke-width="1.5"/>
    <rect x="200" y="50" width="80" height="70" rx="6" stroke-width="1.5"/>
    <circle cx="60" cy="140" r="18" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="18" stroke-width="1.5"/>
    <circle cx="250" cy="140" r="18" stroke-width="1.5"/>
    <line x1="78" y1="140" x2="132" y2="140" stroke-width="1.5"/>
    <line x1="168" y1="140" x2="232" y2="140" stroke-width="1.5"/>
  </g>
</svg>
